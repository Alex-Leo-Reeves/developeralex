<svg width="1080" height="1920" viewBox="0 0 1080 1920" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Master Alex status poster</title>
  <desc id="desc">A tall WhatsApp status poster with the Master Alex logo centered on a glowing gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="992" y2="1856" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07131B" />
      <stop offset="0.5" stop-color="#0D1D29" />
      <stop offset="1" stop-color="#041018" />
    </linearGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(260 320) rotate(90) scale(240 240)">
      <stop stop-color="#72F1C2" stop-opacity="0.38" />
      <stop offset="1" stop-color="#72F1C2" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(860 520) rotate(90) scale(300 300)">
      <stop stop-color="#9ECBFF" stop-opacity="0.30" />
      <stop offset="1" stop-color="#9ECBFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(580 1520) rotate(90) scale(360 360)">
      <stop stop-color="#FFB86B" stop-opacity="0.24" />
      <stop offset="1" stop-color="#FFB86B" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="logoGradient" x1="204" y1="160" x2="876" y2="840" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72F1C2" />
      <stop offset="0.55" stop-color="#9ECBFF" />
      <stop offset="1" stop-color="#FFB86B" />
    </linearGradient>
    <linearGradient id="cut" x1="256" y1="264" x2="824" y2="936" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FB" stop-opacity="0.96" />
      <stop offset="1" stop-color="#F4F8FB" stop-opacity="0.68" />
    </linearGradient>
    <filter id="shadow" x="120" y="110" width="840" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="softGlow" x="120" y="110" width="840" height="840" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
  </defs>
  <rect width="1080" height="1920" fill="url(#bg)" />
  <circle cx="260" cy="320" r="240" fill="url(#glow1)" />
  <circle cx="860" cy="520" r="300" fill="url(#glow2)" />
  <circle cx="580" cy="1520" r="360" fill="url(#glow3)" />
  <g opacity="0.18" stroke="#DCE7EE">
    <path d="M120 208H960" />
    <path d="M120 1712H960" />
  </g>
  <text x="540" y="170" text-anchor="middle" fill="#F4F8FB" font-size="72" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="10">MASTER ALEX</text>
  <text x="540" y="235" text-anchor="middle" fill="#B2C3CE" font-size="30" font-family="Arial, Helvetica, sans-serif" font-weight="600" letter-spacing="6">DESIGN • BUILD • DEPLOY</text>
  <g filter="url(#shadow)">
    <rect x="150" y="320" width="780" height="780" rx="170" fill="#07131B" />
    <rect x="150" y="320" width="780" height="780" rx="170" fill="url(#logoGradient)" fill-opacity="0.12" />
    <rect x="172" y="342" width="736" height="736" rx="152" fill="none" stroke="rgba(244,248,251,0.10)" stroke-width="4"/>
    <g filter="url(#softGlow)">
      <path d="M290 832L408 448H470L540 628L610 448H672L790 832H724L646 558L560 794H520L434 558L356 832H290Z" fill="url(#logoGradient)" fill-opacity="0.28" />
    </g>
    <path d="M290 832L408 448H470L540 628L610 448H672L790 832H724L646 558L560 794H520L434 558L356 832H290Z" fill="url(#cut)" />
    <path d="M330 500L420 500L540 736L660 500L750 500L586 908H494L330 500Z" fill="url(#logoGradient)" fill-opacity="0.22" />
    <path d="M330 930H750" stroke="#F4F8FB" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round" />
  </g>
  <text x="540" y="1240" text-anchor="middle" fill="#F4F8FB" font-size="82" font-family="Arial, Helvetica, sans-serif" font-weight="700">Master Alex</text>
  <text x="540" y="1322" text-anchor="middle" fill="#D7E5EA" font-size="42" font-family="Arial, Helvetica, sans-serif" font-weight="500">Apps • Websites • Games</text>
  <text x="540" y="1410" text-anchor="middle" fill="#B2C3CE" font-size="32" font-family="Arial, Helvetica, sans-serif" font-weight="400">Follow the journey and share the work</text>
  <g opacity="0.95">
    <rect x="265" y="1508" width="550" height="112" rx="56" fill="rgba(244,248,251,0.06)" stroke="rgba(244,248,251,0.12)" stroke-width="2" />
    <text x="540" y="1579" text-anchor="middle" fill="#72F1C2" font-size="34" font-family="Arial, Helvetica, sans-serif" font-weight="700" letter-spacing="4">DESIGNED FOR WHATSAPP STATUS</text>
  </g>
</svg>